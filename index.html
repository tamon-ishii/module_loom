<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ModuleLoom</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="logo-area">
          <span class="logo-icon">📊</span>
          <span class="logo-text">ModuleLoom</span>
          <span class="badge">Graph-It-Live</span>
        </div>
        <div class="controls-area">
          <input type="text" id="project-path-input" placeholder="Python プロジェクトのパス (/path/to/project)" />
          <button id="btn-analyze" class="btn-primary">解析実行</button>
          <div class="filter-controls">
            <input type="text" id="search-input" placeholder="モジュール検索..." />
            <label title="循環インポートに含まれるノードのみ表示"><input type="checkbox" id="chk-only-cycles" /> 循環のみ</label>
            <label title="LOCや関数数が肥大化したモジュールのみ表示"><input type="checkbox" id="chk-only-bloat" /> 肥大化のみ</label>
            <label title="ディレクトリ階層ごとに枠で囲む"><input type="checkbox" id="chk-group-packages" checked /> パッケージ枠</label>
            <label title="選択ノードの直接の依存関係のみハイライト"><input type="checkbox" id="chk-focus-mode" checked /> フォーカス</label>
            <label title="選択モジュールの直接の依存・被依存のみ表示（深層の依存を非表示）"><input type="checkbox" id="chk-direct-only" checked /> 直接依存のみ</label>
          </div>
        </div>
        <div class="toolbar-actions">
          <button id="btn-show-overview" class="btn-secondary" title="プロジェクト全モジュールの全体図を表示">🌐 全体図を見る</button>
          <button id="btn-toggle-tree" class="btn-secondary active" title="ソースツリーの表示/非表示">📁 ツリー</button>
          <label for="layout-select">レイアウト:</label>
          <select id="layout-select">
            <option value="dagre">階層フロー (Dagre)</option>
            <option value="breadthfirst">幅優先ツリー (Tree)</option>
            <option value="cose">力学モデル (CoSE)</option>
            <option value="concentric">同心円 (Concentric)</option>
          </select>
          <div class="zoom-btn-group">
            <button id="btn-header-zoom-out" class="btn-secondary" title="縮小">&minus;</button>
            <button id="btn-header-zoom-in" class="btn-secondary" title="拡大">&#43;</button>
          </div>
          <button id="btn-fit" class="btn-secondary" title="全体が収まるようにズーム調整">全体表示</button>
        </div>
        <div class="editor-select-area">
          <label for="editor-select">ジャンプ先:</label>
          <select id="editor-select">
            <option value="pycharm">PyCharm</option>
            <option value="vscode">VS Code</option>
          </select>
        </div>
      </header>

      <div class="main-container">
        <!-- Python Source Tree Panel -->
        <aside id="tree-panel" class="tree-panel">
          <div class="panel-header">
            <div class="panel-title">
              <span class="panel-icon">📁</span>
              <h3>ソースツリー (.py)</h3>
            </div>
            <div class="panel-actions">
              <button id="btn-tree-collapse-all" class="btn-icon" title="すべて折りたたむ">&minus;</button>
              <button id="btn-tree-expand-all" class="btn-icon" title="すべて展開">&#43;</button>
              <button id="btn-close-tree" class="btn-icon" title="閉じる">&times;</button>
            </div>
          </div>
          <div class="tree-search-area">
            <input type="text" id="tree-search-input" placeholder="Python ファイル検索..." />
          </div>
          <div id="tree-content" class="tree-content">
            <p class="placeholder-text">解析を実行すると Python ソースツリーが表示されます</p>
          </div>
        </aside>

        <div class="graph-wrapper">
          <div id="cy-container" class="graph-canvas"></div>
          <div class="floating-zoom-controls">
            <button id="btn-float-zoom-in" class="btn-float" title="拡大 (Zoom In)">&#43;</button>
            <button id="btn-float-zoom-out" class="btn-float" title="縮小 (Zoom Out)">&minus;</button>
            <button id="btn-float-zoom-reset" class="btn-float" title="等倍リセット (100%)">1:1</button>
            <button id="btn-float-zoom-fit" class="btn-float" title="全体表示 (Fit)">&#x2922;</button>
          </div>
        </div>
        <aside id="inspector-panel" class="inspector-panel">
          <div class="panel-header">
            <h3>モジュール詳細</h3>
            <button id="btn-close-inspector" class="btn-icon">&times;</button>
          </div>
          <div id="inspector-content" class="panel-content">
            <p class="placeholder-text">グラフ上のノードをクリックすると詳細が表示されます</p>
          </div>
        </aside>
      </div>

      <footer class="app-footer">
        <div id="status-bar">準備完了</div>
        <div id="metrics-summary">モジュール数: 0 | 循環インポート: 0 | 肥大化警告: 0</div>
      </footer>
    </div>

    <!-- 依存関係ダイアログ図 モーダル -->
    <div id="dependency-modal" class="modal-overlay hidden">
      <div class="modal-container">
        <div class="modal-header">
          <div class="modal-title-area">
            <span class="modal-icon">📊</span>
            <span class="modal-title">依存ダイアログ図: <span id="modal-module-title" class="highlight-mod-name">module</span></span>
            <div id="modal-header-badges" class="modal-badges"></div>
          </div>
          <div class="modal-controls">
            <label for="modal-layout-select" style="font-size: 0.85rem; color: var(--text-muted);">配置:</label>
            <select id="modal-layout-select" class="select-sm">
              <option value="dagre-lr">階層フロー (利用元 ➔ 指定 ➔ 利用先)</option>
              <option value="dagre-tb">階層フロー (上 ➔ 下)</option>
              <option value="cose">力学モデル</option>
            </select>
            <button id="btn-modal-fit" class="btn-secondary btn-sm" title="全体表示">全体表示</button>
            <button id="btn-modal-zoom-in" class="btn-secondary btn-sm" title="拡大">&#43;</button>
            <button id="btn-modal-zoom-out" class="btn-secondary btn-sm" title="縮小">&minus;</button>
            <button id="btn-close-modal" class="btn-icon modal-close" title="閉じる">&times;</button>
          </div>
        </div>

        <div class="modal-body">
          <div class="modal-legend">
            <div class="legend-item"><span class="legend-box inbound-box"></span> 被依存モジュール (利用元)</div>
            <div class="legend-item"><span class="legend-box focal-box"></span> 指定モジュール</div>
            <div class="legend-item"><span class="legend-box outbound-box"></span> 依存モジュール (利用先)</div>
            <div class="legend-item"><span class="legend-line cycle-line"></span> 循環インポート</div>
          </div>
          <div id="modal-cy-container" class="modal-graph-canvas"></div>
        </div>

        <div class="modal-footer">
          <div id="modal-cycles-info" class="modal-cycles-info"></div>
          <div class="modal-actions">
            <button id="btn-modal-jump-editor" class="btn-secondary btn-sm">エディタで開く</button>
            <button id="btn-modal-close-footer" class="btn-secondary btn-sm">閉じる</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
