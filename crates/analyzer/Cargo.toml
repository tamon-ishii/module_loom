[package]
name = "moduleloom-analyzer"
version = "1.1.0"
edition = "2021"

[dependencies]
rustpython-parser = "0.4.0"
rustpython-ast = { version = "0.4.0", features = ["visitor", "unparse"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
petgraph = "0.8"
walkdir = "2.5"
thiserror = "2.0"
toml = "0.8"
tempfile = "3.10"
regex = "1.10"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
