[package]
name = "moduleloom-analyzer"
version = "1.0.1"
edition = "2021"

[dependencies]
rustpython-parser = "0.4.0"
rustpython-ast = { version = "0.4.0", features = ["visitor"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
petgraph = "0.8"
walkdir = "2.5"
thiserror = "2.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3.10"
