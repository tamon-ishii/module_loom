[package]
name = "moduleloom-gui"
version = "1.0.6"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
moduleloom-analyzer = { path = "../crates/analyzer" }
open = "5.3"
notify = "8.2.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
